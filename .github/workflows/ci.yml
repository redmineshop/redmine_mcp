name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Redmine 7.0.1 plugin tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Checkout Issue Templates when the public repo is readable
        continue-on-error: true
        run: git clone --depth 1 https://github.com/redmineshop/redmine_issue_templates.git /tmp/redmine_issue_templates

      - name: Checkout Issue Checklists when the public repo is readable
        continue-on-error: true
        run: git clone --depth 1 https://github.com/redmineshop/redmine_issue_checklists.git /tmp/redmine_issue_checklists

      - name: Run plugin tests on redmine:7.0.1
        env:
          TEMPLATES_PLUGIN_DIR: /tmp/redmine_issue_templates
          CHECKLISTS_PLUGIN_DIR: /tmp/redmine_issue_checklists
        run: bash test/run-redmine-7.0.1.sh
